[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Forward API calls to the Render backend so the browser sees one site.
# The auth cookie then becomes first-party, which Safari and browsers that
# block third-party cookies accept. Must come before the SPA fallback below.
[[redirects]]
  from = "/api/*"
  to = "https://inventory-management-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
